<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320">
  <rect width="880" height="320" fill="#ffffff"/>
  <text x="24" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">Pooling: 2×2 window, stride 2. No learned weights.</text>
  <text x="24" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e3a5f">Feature map 4×4</text>
  <g font-family="Consolas, monospace" font-size="15" fill="#0f172a">
    <rect x="24" y="92" width="40" height="40" fill="#fde68a" stroke="#1e3a5f"/><rect x="64" y="92" width="40" height="40" fill="#fde68a" stroke="#1e3a5f"/>
    <rect x="104" y="92" width="40" height="40" fill="#bfdbfe" stroke="#1e3a5f"/><rect x="144" y="92" width="40" height="40" fill="#bfdbfe" stroke="#1e3a5f"/>
    <rect x="24" y="132" width="40" height="40" fill="#fde68a" stroke="#1e3a5f"/><rect x="64" y="132" width="40" height="40" fill="#fde68a" stroke="#1e3a5f"/>
    <rect x="104" y="132" width="40" height="40" fill="#bfdbfe" stroke="#1e3a5f"/><rect x="144" y="132" width="40" height="40" fill="#bfdbfe" stroke="#1e3a5f"/>
    <rect x="24" y="172" width="40" height="40" fill="#bbf7d0" stroke="#1e3a5f"/><rect x="64" y="172" width="40" height="40" fill="#bbf7d0" stroke="#1e3a5f"/>
    <rect x="104" y="172" width="40" height="40" fill="#fecaca" stroke="#1e3a5f"/><rect x="144" y="172" width="40" height="40" fill="#fecaca" stroke="#1e3a5f"/>
    <rect x="24" y="212" width="40" height="40" fill="#bbf7d0" stroke="#1e3a5f"/><rect x="64" y="212" width="40" height="40" fill="#bbf7d0" stroke="#1e3a5f"/>
    <rect x="104" y="212" width="40" height="40" fill="#fecaca" stroke="#1e3a5f"/><rect x="144" y="212" width="40" height="40" fill="#fecaca" stroke="#1e3a5f"/>
    <text x="38" y="117">1</text><text x="78" y="117">3</text><text x="118" y="117">2</text><text x="158" y="117">0</text>
    <text x="38" y="157">4</text><text x="78" y="157">2</text><text x="118" y="157">1</text><text x="158" y="157">5</text>
    <text x="38" y="197">0</text><text x="78" y="197">6</text><text x="118" y="197">3</text><text x="158" y="197">1</text>
    <text x="38" y="237">2</text><text x="78" y="237">1</text><text x="118" y="237">7</text><text x="158" y="237">4</text>
  </g>
  <text x="210" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1e3a5f">’</text>
  <text x="250" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e3a5f">Max pool</text>
  <g font-family="Consolas, monospace" font-size="16">
    <rect x="250" y="92" width="48" height="48" fill="#fde68a" stroke="#1e3a5f"/><text x="266" y="122">4</text>
    <rect x="298" y="92" width="48" height="48" fill="#bfdbfe" stroke="#1e3a5f"/><text x="314" y="122">5</text>
    <rect x="250" y="140" width="48" height="48" fill="#bbf7d0" stroke="#1e3a5f"/><text x="266" y="170">6</text>
    <rect x="298" y="140" width="48" height="48" fill="#fecaca" stroke="#1e3a5f"/><text x="314" y="170">7</text>
  </g>
  <text x="380" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0f172a">max(1,3,4,2) = 4</text>
  <text x="380" y="134" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0f172a">max(2,0,1,5) = 5</text>
  <text x="380" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0f172a">max(0,6,2,1) = 6</text>
  <text x="380" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0f172a">max(3,1,7,4) = 7</text>
  <text x="560" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e3a5f">Average pool, same windows</text>
  <text x="560" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0f172a">(1+3+4+2)/4 = 2.5</text>
  <text x="560" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0f172a">(2+0+1+5)/4 = 2</text>
  <text x="560" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0f172a">(0+6+2+1)/4 = 2.25</text>
  <text x="560" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0f172a">(3+1+7+4)/4 = 3.75</text>
  <text x="24" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#334155">LeNet uses average pooling. AlexNet uses max pooling. Global average pooling collapses each whole map to one number.</text>
  <text x="24" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">A small shift inside a window does not change the max. That is why pooling adds a little position tolerance.</text>
</svg>
