<svg xmlns="http://www.w3.org/2000/svg" width="980" height="280" viewBox="0 0 980 280">
  <rect width="980" height="280" fill="#ffffff"/>
  <text x="24" y="32" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">CNN architecture for recognition</text>
  <rect x="20" y="70" width="90" height="70" rx="6" fill="#dbeafe" stroke="#1e3a5f"/>
  <text x="42" y="110" font-family="Arial, sans-serif" font-size="13">Image</text>
  <rect x="140" y="60" width="110" height="90" rx="6" fill="#ffedd5" stroke="#1e3a5f"/>
  <text x="158" y="100" font-family="Arial, sans-serif" font-size="13">Conv + ReLU</text>
  <text x="168" y="120" font-family="Arial, sans-serif" font-size="12">features</text>
  <rect x="280" y="70" width="90" height="70" rx="6" fill="#fde68a" stroke="#1e3a5f"/>
  <text x="302" y="110" font-family="Arial, sans-serif" font-size="13">Pool</text>
  <rect x="400" y="60" width="110" height="90" rx="6" fill="#ffedd5" stroke="#1e3a5f"/>
  <text x="418" y="100" font-family="Arial, sans-serif" font-size="13">Conv + ReLU</text>
  <text x="428" y="120" font-family="Arial, sans-serif" font-size="12">parts</text>
  <rect x="540" y="70" width="90" height="70" rx="6" fill="#fde68a" stroke="#1e3a5f"/>
  <text x="562" y="110" font-family="Arial, sans-serif" font-size="13">Pool</text>
  <rect x="660" y="60" width="120" height="90" rx="6" fill="#e2e8f0" stroke="#1e3a5f"/>
  <text x="688" y="100" font-family="Arial, sans-serif" font-size="13">Fully</text>
  <text x="678" y="120" font-family="Arial, sans-serif" font-size="13">connected</text>
  <rect x="810" y="70" width="140" height="70" rx="6" fill="#bbf7d0" stroke="#15803d"/>
  <text x="842" y="110" font-family="Arial, sans-serif" font-size="13">Softmax</text>
  <text x="24" y="190" font-family="Arial, sans-serif" font-size="13" fill="#334155">Early conv layers: edges and colour. Later conv layers: parts and objects. Pooling shrinks height and width.</text>
  <text x="24" y="214" font-family="Arial, sans-serif" font-size="13" fill="#334155">AlexNet places dropout between the last pool and the first fully connected layer, during training only.</text>
  <text x="24" y="246" font-family="Arial, sans-serif" font-size="13" fill="#334155">LeNet ends in 10 classes. AlexNet ends in 1000 classes. The loss is cross-entropy against the true class.</text>
</svg>
