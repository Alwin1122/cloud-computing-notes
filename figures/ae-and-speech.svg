<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460">
  <rect width="980" height="460" fill="#ffffff"/>
  <text x="24" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">Denoising autoencoder, greedy stack, speech DBN</text>
  <text x="24" y="62" font-family="Arial, sans-serif" font-size="14" font-weight="700">Denoising: corrupt the input, rebuild the clean original</text>
  <rect x="24" y="78" width="80" height="32" rx="4" fill="#dbeafe" stroke="#1e3a5f"/><text x="40" y="99" font-family="Arial, sans-serif" font-size="12">clean x</text>
  <rect x="130" y="78" width="110" height="32" rx="4" fill="#fecaca" stroke="#1e3a5f"/><text x="150" y="99" font-family="Arial, sans-serif" font-size="12">noisy input</text>
  <rect x="266" y="78" width="120" height="32" rx="4" fill="#ffedd5" stroke="#1e3a5f"/><text x="286" y="99" font-family="Arial, sans-serif" font-size="12">autoencoder</text>
  <rect x="412" y="78" width="100" height="32" rx="4" fill="#bbf7d0" stroke="#15803d"/><text x="436" y="99" font-family="Arial, sans-serif" font-size="12">x-hat</text>
  <text x="530" y="99" font-family="Arial, sans-serif" font-size="13">loss against clean x, not against the noise</text>
  <text x="24" y="146" font-family="Arial, sans-serif" font-size="14" font-weight="700">Greedy learning: one layer at a time, labels only at the end</text>
  <rect x="24" y="162" width="200" height="32" rx="4" fill="#dbeafe" stroke="#1e3a5f"/><text x="40" y="183" font-family="Arial, sans-serif" font-size="12">1. Train layer on x. No labels.</text>
  <rect x="240" y="162" width="220" height="32" rx="4" fill="#dbeafe" stroke="#1e3a5f"/><text x="252" y="183" font-family="Arial, sans-serif" font-size="12">2. Train next layer on h1.</text>
  <rect x="476" y="162" width="220" height="32" rx="4" fill="#fde68a" stroke="#1e3a5f"/><text x="492" y="183" font-family="Arial, sans-serif" font-size="12">3. Stack the encoders.</text>
  <rect x="712" y="162" width="240" height="32" rx="4" fill="#bbf7d0" stroke="#15803d"/><text x="728" y="183" font-family="Arial, sans-serif" font-size="12">4. Fine-tune with labels.</text>
  <text x="24" y="230" font-family="Arial, sans-serif" font-size="14" font-weight="700">Speech recognition with a DBN</text>
  <rect x="24" y="248" width="170" height="40" rx="6" fill="#dbeafe" stroke="#1e3a5f"/><text x="48" y="273" font-family="Arial, sans-serif" font-size="13">waveform frames</text>
  <rect x="214" y="248" width="200" height="40" rx="6" fill="#ffedd5" stroke="#1e3a5f"/><text x="236" y="273" font-family="Arial, sans-serif" font-size="13">DBN pretrained, no labels</text>
  <rect x="434" y="248" width="220" height="40" rx="6" fill="#fde68a" stroke="#1e3a5f"/><text x="456" y="273" font-family="Arial, sans-serif" font-size="13">softmax: phonetic states</text>
  <rect x="674" y="248" width="270" height="40" rx="6" fill="#bbf7d0" stroke="#15803d"/><text x="700" y="273" font-family="Arial, sans-serif" font-size="13">HMM still aligns time</text>
  <text x="24" y="320" font-family="Arial, sans-serif" font-size="13">The network replaces the Gaussian mixture. It does not replace the microphone, and it does not translate by itself.</text>
  <text x="24" y="360" font-family="Arial, sans-serif" font-size="14" font-weight="700">Where a semi-supervised answer uses this picture</text>
  <text x="24" y="386" font-family="Arial, sans-serif" font-size="13">Steps 1 to 3 see no class labels. Step 4 sees the few labels you have. That combination is semi-supervised learning.</text>
  <text x="24" y="410" font-family="Arial, sans-serif" font-size="13">A denoising autoencoder that never sees a class name is self-supervised, not yet semi-supervised.</text>
  <text x="24" y="440" font-family="Arial, sans-serif" font-size="13">A GAN becomes semi-supervised only when the discriminator also names the class of a labelled real image.</text>
</svg>
