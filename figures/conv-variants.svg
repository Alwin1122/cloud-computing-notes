<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420">
  <rect width="980" height="420" fill="#ffffff"/>
  <text x="24" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">Convolution variants</text>
  <text x="24" y="64" font-family="Arial, sans-serif" font-size="14" font-weight="700">Padding keeps the border and can keep the size</text>
  <rect x="40" y="80" width="36" height="36" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="76" y="80" width="36" height="36" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="112" y="80" width="36" height="36" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="40" y="116" width="36" height="36" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="76" y="116" width="36" height="36" fill="#fde68a" stroke="#1e3a5f"/>
  <rect x="112" y="116" width="36" height="36" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="40" y="152" width="36" height="36" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="76" y="152" width="36" height="36" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="112" y="152" width="36" height="36" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="86" y="138" font-family="Arial, sans-serif" font-size="12">x</text>
  <text x="170" y="130" font-family="Arial, sans-serif" font-size="13">grey = zeros. The real pixel is now in the centre of a 3x3 window.</text>
  <text x="24" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="700">Stride 2 jumps, so the map shrinks</text>
  <text x="24" y="244" font-family="Arial, sans-serif" font-size="13">Stride 1 visits every position. Stride 2 visits every second position. Fewer outputs, same kernel weights.</text>
  <text x="24" y="276" font-family="Arial, sans-serif" font-size="14" font-weight="700">RGB: one filter, three slices, one feature map</text>
  <rect x="24" y="292" width="70" height="28" fill="#fecaca" stroke="#1e3a5f"/><text x="46" y="311" font-family="Arial, sans-serif" font-size="12">R</text>
  <rect x="100" y="292" width="70" height="28" fill="#bbf7d0" stroke="#1e3a5f"/><text x="122" y="311" font-family="Arial, sans-serif" font-size="12">G</text>
  <rect x="176" y="292" width="70" height="28" fill="#bfdbfe" stroke="#1e3a5f"/><text x="198" y="311" font-family="Arial, sans-serif" font-size="12">B</text>
  <text x="260" y="311" font-family="Arial, sans-serif" font-size="16">added -&gt; 1 map</text>
  <text x="24" y="360" font-family="Arial, sans-serif" font-size="14" font-weight="700">1x1 convolution mixes channels at one pixel. It does not see neighbours.</text>
  <text x="24" y="388" font-family="Arial, sans-serif" font-size="13">Two 3x3 layers in series see a 5x5 neighbourhood and use 18 weights, not 25, per input channel.</text>
</svg>
