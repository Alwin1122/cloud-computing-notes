<svg xmlns="http://www.w3.org/2000/svg" width="960" height="780" viewBox="0 0 960 780">
  <rect width="960" height="780" fill="#ffffff"/>
  <text x="24" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">RNN, LSTM and GRU</text>
  <text x="24" y="62" font-family="Arial, sans-serif" font-size="14" font-weight="700">Plain RNN, unrolled. One cell, copied. Weights do not change with t.</text>
  <rect x="40" y="80" width="90" height="50" rx="6" fill="#dbeafe" stroke="#1e3a5f"/>
  <text x="62" y="110" font-family="Arial, sans-serif" font-size="14">t - 1</text>
  <rect x="190" y="80" width="90" height="50" rx="6" fill="#dbeafe" stroke="#1e3a5f"/>
  <text x="226" y="110" font-family="Arial, sans-serif" font-size="14">t</text>
  <rect x="340" y="80" width="90" height="50" rx="6" fill="#dbeafe" stroke="#1e3a5f"/>
  <text x="362" y="110" font-family="Arial, sans-serif" font-size="14">t + 1</text>
  <line x1="130" y1="105" x2="190" y2="105" stroke="#15803d" stroke-width="2"/>
  <line x1="280" y1="105" x2="340" y2="105" stroke="#15803d" stroke-width="2"/>
  <text x="148" y="98" font-family="Arial, sans-serif" font-size="12" fill="#15803d">h</text>
  <text x="300" y="98" font-family="Arial, sans-serif" font-size="12" fill="#15803d">h</text>
  <text x="55" y="155" font-family="Arial, sans-serif" font-size="13">x, y</text>
  <text x="210" y="155" font-family="Arial, sans-serif" font-size="13">x, y</text>
  <text x="355" y="155" font-family="Arial, sans-serif" font-size="13">x, y</text>
  <text x="450" y="100" font-family="Arial, sans-serif" font-size="13" fill="#0f172a">h_t = tanh(W_xh x_t + W_hh h_(t-1) + b)</text>
  <text x="450" y="122" font-family="Arial, sans-serif" font-size="13" fill="#334155">h is rewritten every step. A long product of small</text>
  <text x="450" y="140" font-family="Arial, sans-serif" font-size="13" fill="#334155">slopes makes the early gradient vanish.</text>
  <text x="24" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="700">LSTM. Two memories. C is the highway through time.</text>
  <rect x="70" y="230" width="170" height="28" rx="4" fill="#dcfce7" stroke="#15803d"/>
  <text x="84" y="249" font-family="Arial, sans-serif" font-size="13">C_(t-1) cell, long</text>
  <text x="260" y="249" font-family="Arial, sans-serif" font-size="16">x f</text>
  <text x="310" y="249" font-family="Arial, sans-serif" font-size="16">+</text>
  <text x="340" y="249" font-family="Arial, sans-serif" font-size="16">x i</text>
  <rect x="400" y="230" width="80" height="28" rx="4" fill="#dcfce7" stroke="#15803d"/>
  <text x="424" y="249" font-family="Arial, sans-serif" font-size="13">C_t</text>
  <text x="510" y="249" font-family="Arial, sans-serif" font-size="13">tanh(C_t) x o  -&gt;  h_t</text>
  <text x="70" y="290" font-family="Arial, sans-serif" font-size="13" fill="#c2410c">f = sigmoid    forget: keep or erase</text>
  <text x="70" y="312" font-family="Arial, sans-serif" font-size="13" fill="#c2410c">i = sigmoid    input: how much to write</text>
  <text x="70" y="334" font-family="Arial, sans-serif" font-size="13" fill="#1d4ed8">C~ = tanh      the new note</text>
  <text x="70" y="356" font-family="Arial, sans-serif" font-size="13" fill="#c2410c">o = sigmoid    output: what to show</text>
  <text x="420" y="300" font-family="Arial, sans-serif" font-size="13" fill="#334155">h_t goes to the next step and to y</text>
  <text x="24" y="400" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">C_t = f_t * C_(t-1) + i_t * C~_t</text>
  <text x="24" y="422" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">h_t = o_t * tanh(C_t)</text>
  <text x="24" y="448" font-family="Arial, sans-serif" font-size="13" fill="#334155">Each gate is an RNN step with its own weights. Four weight sets.</text>
  <text x="24" y="490" font-family="Arial, sans-serif" font-size="14" font-weight="700">GRU. One memory h. The update gate is the mixer tap. No output gate.</text>
  <rect x="70" y="520" width="100" height="28" rx="4" fill="#dbeafe" stroke="#1e3a5f"/>
  <text x="96" y="539" font-family="Arial, sans-serif" font-size="13">h_(t-1)</text>
  <text x="190" y="539" font-family="Arial, sans-serif" font-size="15">x (1-z)</text>
  <text x="270" y="539" font-family="Arial, sans-serif" font-size="16">+</text>
  <text x="300" y="539" font-family="Arial, sans-serif" font-size="15">x z</text>
  <rect x="360" y="520" width="70" height="28" rx="4" fill="#dbeafe" stroke="#1e3a5f"/>
  <text x="380" y="539" font-family="Arial, sans-serif" font-size="13">h_t</text>
  <text x="450" y="539" font-family="Arial, sans-serif" font-size="13" fill="#334155">h_t is both memory and output</text>
  <text x="70" y="590" font-family="Arial, sans-serif" font-size="13" fill="#c2410c">z = sigmoid   update: 0 keeps old, 1 writes new</text>
  <text x="70" y="612" font-family="Arial, sans-serif" font-size="13" fill="#c2410c">r = sigmoid   reset: filters h_(t-1) before the candidate</text>
  <text x="70" y="634" font-family="Arial, sans-serif" font-size="13" fill="#1d4ed8">h~ = tanh( W x_t + U (r * h_(t-1)) + b )</text>
  <text x="70" y="670" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">h_t = (1 - z_t) * h_(t-1) + z_t * h~_t</text>
  <text x="70" y="696" font-family="Arial, sans-serif" font-size="13" fill="#334155">(1-z) plays the LSTM forget role. z plays the input role. They sum to 1.</text>
  <text x="70" y="718" font-family="Arial, sans-serif" font-size="13" fill="#334155">Three weight sets, not four. If a library swaps z and (1-z), read which term z multiplies.</text>
  <text x="70" y="746" font-family="Arial, sans-serif" font-size="13" fill="#334155">Class numbers: GRU h=0.8, r=0.5, z=0.3 gives h_t=0.759. LSTM f=0.9 gives C_t=1.02. If f=0, C_t=0.30.</text>
</svg>
