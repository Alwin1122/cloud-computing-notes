  <rect x="380" y="230" width="120" height="28" rx="4" fill="#dcfce7" stroke="#15803d"/>
  <text x="410" y="249" font-family="Segoe UI, Arial, sans-serif" font-size="13">Cœ</text>
  <text x="230" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c2410c">f = Ã(·)   forget, keep or erase</text>
