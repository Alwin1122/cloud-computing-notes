  <text x="330" y="499" font-family="Segoe UI, Arial, sans-serif" font-size="16">+</text>
  <text x="360" y="499" font-family="Segoe UI, Arial, sans-serif" font-size="15">× z</text>
  <rect x="420" y="480" width="90" height="28" rx="4" fill="#dbeafe" stroke="#1e3a5f"/>
  <text x="448" y="499" font-family="Segoe UI, Arial, sans-serif" font-size="13">hœ</text>
