  <text x="230" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c2410c">o = Ã(·)   output, what to show</text>
  <text x="520" y="249" font-family="Segoe UI, Arial, sans-serif" font-size="13">tanh(Cœ) × o  ’  hœ</text>
  <text x="520" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">hœ goes to the next step and to w</text>
  <text x="24" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0f172a">Cœ = fœ ™ Cœ‹ + iœ ™ Cœ          hœ = oœ ™ tanh(Cœ)</text>
  <text x="24" y="402" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">Each gate is an RNN step with its own weights: Ã(Wxœ + Uhœ‹ + b). Four weight sets.</text>

  <text x="24" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">GRU. One memory h. Update gate is the mixer tap. No output gate.</text>
