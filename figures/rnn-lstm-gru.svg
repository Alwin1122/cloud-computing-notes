  <text x="450" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#0f172a">hœ = tanh(W“• xœ + W•• hœ‹ + b)</text>
  <text x="450" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">h is rewritten every step. Long products of small</text>
  <text x="450" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">slopes make the early gradient vanish.</text>

  <text x="24" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">LSTM. Two memories. C is the highway through time.</text>
