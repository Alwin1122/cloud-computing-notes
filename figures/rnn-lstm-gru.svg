  <text x="70" y="550" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c2410c">z = Ã(·)  update: 0 keeps old, 1 writes new</text>
  <text x="70" y="572" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c2410c">r = Ã(·)  reset: filters hœ‹ before the candidate</text>
  <text x="70" y="594" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1d4ed8">h = tanh(W xœ + U (r ™ hœ‹) + b)</text>
  <text x="70" y="630" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0f172a">hœ = (1  zœ) ™ hœ‹ + zœ ™ hœ</text>
  <text x="70" y="658" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">(1z) plays LSTMs forget role. z plays the input role. They sum to 1.</text>
  <text x="70" y="680" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">Three weight sets, not four. If a library swaps z and (1z), the letter flips, the mixer does not.</text>
  <text x="70" y="720" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">Worked GRU step from class: h=0.8, r=0.5, z=0.3 ’ h=tanh(0.8)=0.664 ’ hœ=0.7×0.8+0.3×0.664=0.759</text>
  <text x="70" y="748" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">Worked LSTM step: C=0.8, f=0.9, i=0.5, C=0.6 ’ Cœ=1.02. If f=0, Cœ=0.30 only.</text>
