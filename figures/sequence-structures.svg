<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
  <rect width="980" height="560" fill="#ffffff"/>
  <text x="24" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">Bidirectional RNN, encoder-decoder, recursive net</text>
  <text x="24" y="62" font-family="Arial, sans-serif" font-size="14" font-weight="700">Bidirectional: two chains, states joined</text>
  <text x="24" y="88" font-family="Arial, sans-serif" font-size="13">forward:  w1 -&gt; w2 -&gt; w3</text>
  <text x="24" y="110" font-family="Arial, sans-serif" font-size="13">backward: w1 &lt;- w2 &lt;- w3</text>
  <text x="24" y="132" font-family="Arial, sans-serif" font-size="13">output at w2 = concat(forward state, backward state). The whole sentence must already be known.</text>
  <text x="24" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="700">Encoder-decoder: lengths may differ</text>
  <rect x="24" y="186" width="300" height="36" rx="6" fill="#dbeafe" stroke="#1e3a5f"/>
  <text x="40" y="209" font-family="Arial, sans-serif" font-size="13">Encoder reads I love AI</text>
  <rect x="340" y="186" width="70" height="36" rx="6" fill="#fecaca" stroke="#1e3a5f"/>
  <text x="360" y="209" font-family="Arial, sans-serif" font-size="13">one h</text>
  <rect x="426" y="186" width="320" height="36" rx="6" fill="#ffedd5" stroke="#1e3a5f"/>
  <text x="446" y="209" font-family="Arial, sans-serif" font-size="13">Decoder writes Ich liebe KI</text>
  <text x="24" y="248" font-family="Arial, sans-serif" font-size="13">That single h is the bottleneck. Attention replaces it with one vector per input word.</text>
  <text x="24" y="286" font-family="Arial, sans-serif" font-size="14" font-weight="700">Recursive net: same function on a tree, not a chain</text>
  <rect x="70" y="430" width="90" height="32" rx="4" fill="#dbeafe" stroke="#1e3a5f"/><text x="98" y="451" font-family="Arial, sans-serif" font-size="12">very</text>
  <rect x="180" y="430" width="90" height="32" rx="4" fill="#dbeafe" stroke="#1e3a5f"/><text x="204" y="451" font-family="Arial, sans-serif" font-size="12">good</text>
  <rect x="100" y="370" width="140" height="32" rx="4" fill="#fde68a" stroke="#1e3a5f"/><text x="130" y="391" font-family="Arial, sans-serif" font-size="12">very good</text>
  <rect x="280" y="370" width="80" height="32" rx="4" fill="#dbeafe" stroke="#1e3a5f"/><text x="302" y="391" font-family="Arial, sans-serif" font-size="12">not</text>
  <rect x="160" y="308" width="160" height="36" rx="4" fill="#bbf7d0" stroke="#15803d"/><text x="180" y="331" font-family="Arial, sans-serif" font-size="13">not very good</text>
  <line x1="115" y1="430" x2="150" y2="402" stroke="#1e3a5f"/>
  <line x1="225" y1="430" x2="190" y2="402" stroke="#1e3a5f"/>
  <line x1="170" y1="370" x2="220" y2="344" stroke="#1e3a5f"/>
  <line x1="320" y1="370" x2="270" y2="344" stroke="#1e3a5f"/>
  <text x="480" y="330" font-family="Arial, sans-serif" font-size="13">Same weights at every parent.</text>
  <text x="480" y="354" font-family="Arial, sans-serif" font-size="13">A recurrent net would read</text>
  <text x="480" y="378" font-family="Arial, sans-serif" font-size="13">not, very, good left to right.</text>
  <text x="480" y="410" font-family="Arial, sans-serif" font-size="13">The tree composes the phrase</text>
  <text x="480" y="434" font-family="Arial, sans-serif" font-size="13">before the negation is applied.</text>
  <text x="24" y="500" font-family="Arial, sans-serif" font-size="13" fill="#334155">Use this figure for phrase sentiment. Bidirectional and stacked models are still chains.</text>
  <text x="24" y="528" font-family="Arial, sans-serif" font-size="13" fill="#334155">Named-entity recognition can be bidirectional because the sentence is complete. Live next-word prediction cannot.</text>
</svg>
